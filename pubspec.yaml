name: flatconfig
description: >
  Flat, human-friendly key=value configuration format for Dart & Flutter —
  inspired by Ghostty, simpler than INI or TOML.
version: 0.5.0

repository: https://github.com/grumpypixel/flatconfig
issue_tracker: https://github.com/grumpypixel/flatconfig/issues
homepage: https://github.com/grumpypixel/flatconfig

topics:
  - config
  - parser
  - keyvalue
  - ghostty
  - flat

environment:
  # 3.8 is the lowest SDK the dependencies resolve on: path 1.9.1 needs 3.4,
  # meta 1.17.0 needs 3.5, lints 6.0.0 needs 3.8. CI builds on it to keep the
  # number honest.
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  meta: ">=1.16.0 <2.0.0"
  path: ^1.9.1

dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
