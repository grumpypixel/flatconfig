# Flatconfig asset used by the Flutter web example

title = Flatconfig Flutter
welcome-message = "Hello from assets via flatconfig!"
debug = true
padding = 20

# Pull in the colours. An asset can only be read through a Future, so this is
# resolved by an asynchronous resolver — see AssetBundleIncludeResolver.
config-file = theme.conf

# Optional: missing is fine, and nothing has to handle the absence.
config-file = ?user.conf
